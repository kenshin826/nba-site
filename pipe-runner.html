<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Pipe Runner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0b0f1d">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: one full-bleed canvas; touch controls float over it in landscape and sit in a dock under it in portrait. */
:root{
  --ink:#0b0f1d;
  --ink-2:#151b31;
  --glass:rgba(255,255,255,.13);
  --glass-hi:rgba(255,255,255,.32);
  --line:rgba(255,255,255,.34);
  --fg:#fff;
  --muted:#b9c2e0;
  --gold:#ffc83d;
  --gold-d:#c77d08;
  --red:#e2363a;
  --display:"Lilita One","Arial Black",system-ui,sans-serif;
  --ui:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --game-top:0px;
  --game-bottom:100vh;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--fg);
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body{font-family:var(--ui);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#sa{position:fixed;visibility:hidden;pointer-events:none;inset:0;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}

/* touch pad */
#pad{position:fixed;left:0;right:0;bottom:0;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-end;
  padding:0 max(18px,calc(env(safe-area-inset-right,0px) + 10px)) max(16px,calc(env(safe-area-inset-bottom,0px) + 10px)) max(18px,calc(env(safe-area-inset-left,0px) + 10px))}
[hidden]{display:none!important}
.portrait #pad{top:var(--game-bottom);align-items:center;padding-bottom:max(20px,env(safe-area-inset-bottom,0px));
  background:linear-gradient(180deg,#1a2140 0%,var(--ink) 70%)}
.portrait #pad::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:rgba(255,255,255,.12)}
.ctl{pointer-events:auto;touch-action:none;background:var(--glass);border:1.5px solid var(--line);color:var(--fg);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 6px 20px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.25)}
#dpad{position:relative;width:196px;height:92px;border-radius:46px;display:flex}
#dpad .half{flex:1;display:flex;align-items:center;justify-content:space-between;padding:0 16px;opacity:.9;transition:background .08s}
#dpad .half.l{flex-direction:row-reverse;border-radius:46px 0 0 46px}
#dpad .half.r{border-radius:0 46px 46px 0}
#dpad .half.on{background:var(--glass-hi)}
#dpad .half.run{background:rgba(255,200,61,.38)}
#dpad::after{content:"";position:absolute;left:50%;top:22%;bottom:22%;width:1px;background:var(--line)}
.chev{width:0;height:0;border-top:11px solid transparent;border-bottom:11px solid transparent}
.r .chev{border-left:15px solid #fff}.l .chev{border-right:15px solid #fff}
.chev2{display:flex;gap:1px;opacity:.55}
.chev2 i{width:0;height:0;border-top:7px solid transparent;border-bottom:7px solid transparent}
.r .chev2 i{border-left:9px solid var(--gold)}.l .chev2 i{border-right:9px solid var(--gold)}
#btns{display:flex;gap:16px;align-items:flex-end}
.round{border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--display);font-size:26px;line-height:1;padding:0;cursor:pointer}
.round small{font-family:var(--ui);font-weight:900;font-size:9px;letter-spacing:.14em;opacity:.75;margin-top:3px}
#bB{width:70px;height:70px;margin-bottom:26px}
#bA{width:88px;height:88px;background:rgba(226,54,58,.42);border-color:rgba(255,160,150,.6)}
.round.on{background:var(--glass-hi);transform:scale(.94)}
#bA.on{background:rgba(255,80,80,.7)}
.portrait #dpad{width:min(46vw,210px);height:104px;border-radius:52px}
.portrait #bA{width:96px;height:96px}
.portrait #bB{width:76px;height:76px}

/* top bar buttons */
#pauseBtn{position:fixed;width:42px;height:42px;border-radius:12px;top:calc(var(--game-top) + 10px);right:max(12px,calc(env(safe-area-inset-right,0px) + 8px));
  display:flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;padding:0}
#pauseBtn i{width:5px;height:16px;border-radius:2px;background:#fff}
#pauseBtn:focus-visible,.btn:focus-visible,.round:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

/* screens */
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:5;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.screen.dim{background:radial-gradient(ellipse at center,rgba(8,12,28,.35),rgba(8,12,28,.78))}
.panel{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;max-width:440px;width:100%}
.logo{font-family:var(--display);font-size:clamp(46px,12vw,86px);line-height:.9;margin:0;letter-spacing:.01em;text-wrap:balance;
  color:var(--gold);-webkit-text-stroke:2px #5a2c00;
  text-shadow:0 4px 0 #8a4300,0 8px 0 #4b2200,0 14px 30px rgba(0,0,0,.55)}
.logo span{display:block;color:#fff;-webkit-text-stroke:2px #7a1013;text-shadow:0 4px 0 #b3191e,0 8px 0 #5c0a0d,0 14px 30px rgba(0,0,0,.55)}
.tag{font-weight:800;font-size:15px;color:#eef2ff;margin:4px 0 0;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.btn{font-family:var(--display);font-size:24px;letter-spacing:.03em;color:#3a1d00;border:0;border-radius:16px;padding:14px 38px;cursor:pointer;
  background:linear-gradient(180deg,#ffe58a,#ffc83d 55%,#f0a312);box-shadow:0 5px 0 var(--gold-d),0 10px 24px rgba(0,0,0,.4);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--gold-d),0 6px 16px rgba(0,0,0,.4)}
.btn.ghost{background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 0 0 0 1.5px var(--line);font-size:18px;padding:11px 26px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.meta{font-weight:800;font-size:13px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.help{font-weight:700;font-size:13px;line-height:1.5;color:#dfe5fa;background:rgba(10,14,30,.55);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:10px 14px;max-width:360px}
.help b{color:var(--gold)}
.card-title{font-family:var(--display);font-size:clamp(40px,10vw,64px);margin:0;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.5)}
.card-sub{font-weight:900;font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin:0}
#card{pointer-events:none}
#card .panel{animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#card .panel{animation:none}}
.kbd-only{display:none}.no-touch .kbd-only{display:inline}.no-touch .touch-only{display:none}
</style>
</head>
<body>

<canvas id="c" aria-label="Pipe Runner game"></canvas>
<div id="sa"></div>

<button id="pauseBtn" class="ctl" aria-label="Pause" hidden><i></i><i></i></button>

<div id="pad" hidden>
  <div id="dpad" class="ctl" aria-label="Move left or right. Push to the edge to run.">
    <div class="half l"><span class="chev"></span><span class="chev2"><i></i><i></i></span></div>
    <div class="half r"><span class="chev"></span><span class="chev2"><i></i><i></i></span></div>
  </div>
  <div id="btns">
    <button id="bB" class="ctl round" aria-label="Run">B<small>RUN</small></button>
    <button id="bA" class="ctl round" aria-label="Jump">A<small>JUMP</small></button>
  </div>
</div>

<div id="title" class="screen dim">
  <div class="panel">
    <h1 class="logo">Pipe<span>Runner</span></h1>
    <p class="tag">Stomp, bump and dash your way to the flag.</p>
    <button id="playBtn" class="btn">Play</button>
    <div class="row"><button id="soundBtn" class="btn ghost">Sound: On</button></div>
    <p class="help"><span class="touch-only">Left pad moves. Push to the <b>gold edge</b> to run (or hold <b>B</b>). Tap <b>A</b> to jump, hold it to jump higher.</span><span class="kbd-only"><b>Arrows / WASD</b> move · <b>Space</b> jump · <b>Shift</b> run · <b>P</b> pause</span></p>
    <p class="meta" id="hiText">Best 000000</p>
  </div>
</div>

<div id="card" class="screen" hidden>
  <div class="panel"><p class="card-sub" id="cardSub">Morning</p><h2 class="card-title" id="cardTitle">World 1</h2><p class="meta" id="cardLives">Lives × 3</p></div>
</div>

<div id="pause" class="screen dim" hidden>
  <div class="panel">
    <h2 class="card-title">Paused</h2>
    <button id="resumeBtn" class="btn">Resume</button>
    <div class="row"><button id="restartBtn" class="btn ghost">Restart world</button><button id="sound2Btn" class="btn ghost">Sound: On</button></div>
  </div>
</div>

<div id="over" class="screen dim" hidden>
  <div class="panel">
    <h2 class="card-title" id="overTitle">Game Over</h2>
    <p class="meta" id="overScore">Score 000000</p>
    <button id="againBtn" class="btn">Play again</button>
  </div>
</div>

<script>
'use strict';
(() => {
const T = 48, ROWS = 14, VH = ROWS * T, TS = 96, STEP = 1 / 120;
const $ = id => document.getElementById(id);
const cvs = $('c'), ctx = cvs.getContext('2d');
const store = {
  get(k, d) { try { const v = localStorage.getItem('piperunner.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('piperunner.' + k, JSON.stringify(v)); } catch (e) {} }
};
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }
function rr(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function vibrate(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }

/* ---------- viewport ---------- */
let DPR = 1, W = 0, H = 0, S = 1, VW = 0, GY = 0, portrait = false, SA = { t: 0, r: 0, b: 0, l: 0 };
function resize() {
  const cs = getComputedStyle($('sa'));
  SA = { t: parseFloat(cs.paddingTop) || 0, r: parseFloat(cs.paddingRight) || 0, b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0 };
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  W = innerWidth; H = innerHeight;
  cvs.width = Math.round(W * DPR); cvs.height = Math.round(H * DPR);
  portrait = H > W * 1.05;
  if (portrait) { S = Math.min((H * 0.62 - SA.t) / VH, W / (14 * T)); GY = SA.t; }
  else { S = H / VH; if (W / S < 15 * T) S = W / (15 * T); GY = (H - VH * S) / 2; }
  VW = W / S;
  const root = document.documentElement.style;
  root.setProperty('--game-top', GY + 'px');
  root.setProperty('--game-bottom', (GY + VH * S) + 'px');
  document.body.classList.toggle('portrait', portrait);
  skyGrad = null;
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 200));

/* ---------- themes ---------- */
const THEMES = [
  { name: 'Morning Meadows', skyT: '#2f7fdc', skyM: '#7fbcf2', skyB: '#d9efff', sun: [255, 246, 214], sunX: .78, sunY: .16, haze: '#cfe6ff',
    mtnFar: '#93b2d8', mtnNear: '#6f8fbc', snow: true, hillA: '#5ea84d', hillB: '#2f6e33', tree: ['#4a9a3e', '#22582a'], cloud: '#ffffff', cloudSh: '#c3d6ee', night: false },
  { name: 'Sunset Ridge', skyT: '#263578', skyM: '#c4688a', skyB: '#ffbe73', sun: [255, 210, 130], sunX: .3, sunY: .5, haze: '#f6b98c',
    mtnFar: '#a07796', mtnNear: '#6d557f', snow: false, hillA: '#6b7c3a', hillB: '#3b4a26', tree: ['#56702f', '#2d3d1c'], cloud: '#ffe0c8', cloudSh: '#c9849a', night: false },
  { name: 'Moonlit Hollow', skyT: '#070b22', skyM: '#1d2350', skyB: '#3f3e78', sun: [225, 232, 255], sunX: .72, sunY: .18, haze: '#4a4b85',
    mtnFar: '#2f3766', mtnNear: '#232a52', snow: true, hillA: '#2c4c3e', hillB: '#162a24', tree: ['#284a3a', '#122520'], cloud: '#8a90c0', cloudSh: '#3c4170', night: true }
];
let TH = THEMES[0];

/* ---------- textures ---------- */
const tex = {};
function noiseDots(g, R, n, w, h, dark, light, aMin, aMax, sMax) {
  for (let i = 0; i < n; i++) {
    g.fillStyle = `rgba(${R() < .55 ? dark : light},${aMin + R() * (aMax - aMin)})`;
    const s = 1 + R() * sMax; g.fillRect(R() * w, R() * h, s, s);
  }
}
function bevel(g, x, y, w, h, b, hi, lo) {
  g.fillStyle = hi; g.beginPath(); g.moveTo(x, y); g.lineTo(x + w, y); g.lineTo(x + w - b, y + b); g.lineTo(x + b, y + b); g.lineTo(x + b, y + h - b); g.lineTo(x, y + h); g.fill();
  g.fillStyle = lo; g.beginPath(); g.moveTo(x + w, y); g.lineTo(x + w, y + h); g.lineTo(x, y + h); g.lineTo(x + b, y + h - b); g.lineTo(x + w - b, y + h - b); g.lineTo(x + w - b, y + b); g.fill();
}
function rivets(g, s, col) {
  for (const [x, y] of [[12, 12], [s - 12, 12], [12, s - 12], [s - 12, s - 12]]) {
    const gr = g.createRadialGradient(x - 1.5, y - 1.5, .5, x, y, 5); gr.addColorStop(0, 'rgba(255,255,255,.85)'); gr.addColorStop(.4, col); gr.addColorStop(1, 'rgba(0,0,0,.55)');
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, 4.5, 0, 7); g.fill();
  }
}
function buildTextures() {
  const s = TS;
  // ground
  for (const grass of [true, false]) {
    const [c, g] = mk(s, s), R = rng(grass ? 11 : 12);
    let gr = g.createLinearGradient(0, 0, 0, s); gr.addColorStop(0, '#a4632f'); gr.addColorStop(1, '#6a3a1b');
    g.fillStyle = gr; g.fillRect(0, 0, s, s);
    // soil strata
    for (let i = 0; i < 5; i++) { g.fillStyle = `rgba(60,30,12,${.08 + R() * .1})`; g.fillRect(0, 18 + i * 17 + R() * 6, s, 2 + R() * 3); }
    noiseDots(g, R, 340, s, s, '50,24,8', '220,160,100', .1, .3, 3);
    for (let i = 0; i < 7; i++) {
      const x = R() * s, y = (grass ? 30 : 6) + R() * (s - (grass ? 36 : 12)), r = 3 + R() * 6;
      const pg = g.createRadialGradient(x - r * .3, y - r * .4, r * .1, x, y, r); pg.addColorStop(0, '#d9cbb6'); pg.addColorStop(.6, '#8c7a66'); pg.addColorStop(1, '#4b3a2b');
      g.fillStyle = 'rgba(30,14,4,.4)'; g.beginPath(); g.ellipse(x + 1.5, y + 2, r, r * .75, 0, 0, 7); g.fill();
      g.fillStyle = pg; g.beginPath(); g.ellipse(x, y, r, r * .75, 0, 0, 7); g.fill();
    }
    if (grass) {
      g.fillStyle = 'rgba(30,14,4,.35)'; g.fillRect(0, 22, s, 10);
      gr = g.createLinearGradient(0, 0, 0, 30); gr.addColorStop(0, '#9be35c'); gr.addColorStop(.5, '#5fb83a'); gr.addColorStop(1, '#357d25');
      g.fillStyle = gr; g.beginPath(); g.moveTo(0, 0); g.lineTo(s, 0);
      for (let x = s; x >= 0; x -= 6) g.lineTo(x, 22 + Math.sin(x * .55) * 3 + R() * 5);
      g.closePath(); g.fill();
      for (let i = 0; i < 60; i++) {
        const x = R() * s, h = 5 + R() * 9; g.strokeStyle = R() < .5 ? 'rgba(200,255,150,.55)' : 'rgba(30,90,20,.6)'; g.lineWidth = 1.3;
        g.beginPath(); g.moveTo(x, 18 + R() * 6); g.lineTo(x + (R() - .5) * 4, 18 - h + 8); g.stroke();
      }
      g.fillStyle = 'rgba(255,255,255,.35)'; g.fillRect(0, 0, s, 2.5);
    }
    tex[grass ? 'grass' : 'dirt'] = c;
  }
  // brick
  {
    const [c, g] = mk(s, s), R = rng(21);
    g.fillStyle = '#4a2010'; g.fillRect(0, 0, s, s);
    const bh = s / 4;
    for (let row = 0; row < 4; row++) {
      const off = row % 2 ? -s / 4 : 0;
      for (let bx = off; bx < s; bx += s / 2) {
        const x = bx + 2, y = row * bh + 2, w = s / 2 - 4, h = bh - 4;
        const gr = g.createLinearGradient(0, y, 0, y + h); const tint = R() * 18 - 9;
        gr.addColorStop(0, `rgb(${222 + tint},${120 + tint},${74 + tint})`); gr.addColorStop(.45, `rgb(${184 + tint},${82 + tint},${44})`); gr.addColorStop(1, `rgb(${128 + tint},${50},${26})`);
        g.fillStyle = gr; rr(g, x, y, w, h, 3); g.fill();
        g.fillStyle = 'rgba(255,220,190,.35)'; g.fillRect(x + 3, y + 1, w - 6, 2);
        g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(x + 2, y + h - 3, w - 4, 2);
      }
    }
    noiseDots(g, R, 220, s, s, '40,10,0', '255,200,160', .08, .22, 2);
    g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(0, s - 2, s, 2); g.fillRect(s - 2, 0, 2, s);
    tex.brick = c;
  }
  // question block
  {
    const [c, g] = mk(s, s), R = rng(31);
    let gr = g.createLinearGradient(0, 0, s, s); gr.addColorStop(0, '#ffe58a'); gr.addColorStop(.5, '#ffbf2e'); gr.addColorStop(1, '#d98a0c');
    g.fillStyle = gr; g.fillRect(0, 0, s, s);
    noiseDots(g, R, 120, s, s, '140,70,0', '255,250,210', .06, .18, 2);
    bevel(g, 0, 0, s, s, 7, 'rgba(255,250,215,.7)', 'rgba(110,50,0,.6)');
    g.strokeStyle = 'rgba(70,30,0,.85)'; g.lineWidth = 3; g.strokeRect(1.5, 1.5, s - 3, s - 3);
    rivets(g, s, '#b86d06');
    g.font = `64px ${'"Lilita One","Arial Black",sans-serif'}`; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillStyle = 'rgba(90,40,0,.75)'; g.fillText('?', s / 2 + 4, s / 2 + 8);
    gr = g.createLinearGradient(0, 20, 0, 76); gr.addColorStop(0, '#fffdf0'); gr.addColorStop(1, '#ffe2a0');
    g.fillStyle = gr; g.fillText('?', s / 2, s / 2 + 3);
    tex.q = c;
  }
  // used block
  {
    const [c, g] = mk(s, s), R = rng(41);
    const gr = g.createLinearGradient(0, 0, s, s); gr.addColorStop(0, '#b07a4a'); gr.addColorStop(1, '#6b4224');
    g.fillStyle = gr; g.fillRect(0, 0, s, s);
    noiseDots(g, R, 200, s, s, '40,20,5', '230,190,150', .08, .2, 2);
    bevel(g, 0, 0, s, s, 7, 'rgba(255,225,190,.4)', 'rgba(40,18,4,.55)');
    g.strokeStyle = 'rgba(40,18,4,.9)'; g.lineWidth = 3; g.strokeRect(1.5, 1.5, s - 3, s - 3);
    rivets(g, s, '#5a3418');
    tex.used = c;
  }
  // hard stone block
  {
    const [c, g] = mk(s, s), R = rng(51);
    const gr = g.createLinearGradient(0, 0, s, s); gr.addColorStop(0, '#c8c2b6'); gr.addColorStop(1, '#7c776d');
    g.fillStyle = gr; g.fillRect(0, 0, s, s);
    noiseDots(g, R, 420, s, s, '50,48,44', '255,255,250', .08, .25, 2.5);
    bevel(g, 0, 0, s, s, 9, 'rgba(255,255,255,.45)', 'rgba(30,28,24,.5)');

/* ---------- level generation ---------- */
// tiles: 1 ground, 2 brick, 3 ?coin, 4 ?power, 5 used, 6 hard, 7-10 pipe, 12 coin
const solid = t => t >= 1 && t <= 10;
let L = null, levelN = 1;

  const ents = [], deco = [];

    if (k < .16) { const w = ri(6, 10); ground(x, x + w); if (R() < .7) foe(x + ri(2, w - 2)); if (R() < .4 + diff * .3) foe(x + w - 2, 'walker'); x += w; }

      const pat = [[2, 3, 2, 3, 2], [3, 2, 4, 2, 3], [2, 2, 3, 2, 2], [3, 0, 3, 0, 3]][ri(0, 3)];
      pat.forEach((t, i) => { if (t) set(x + 2 + i, 8, t === 4 ? (powerLeft-- > 0 ? 4 : 3) : t); });

      x += h + 3;
    }
    else if (k < .9) {

  }
  ground(x, len);

  for (let i = 0; i < 8; i++) for (let h = 0; h <= i; h++) set(sx + i, 11 - h, 6);

  }
  if (p && !p.hidden && state !== 'title') {
    const flick = p.inv > 0 && Math.floor(time * 20) % 2 === 0;
    const showBig = p.growT > 0 ? Math.floor(p.growT * 14) % 2 === 0 ? p.big : !p.big : p.big;
    if (state !== 'dying') shadow(p, 16);
    if (!flick) {
      const dying = state === 'dying';
      drawHero(p.x + p.w / 2, p.y + p.h, dying ? false : showBig, p.face, {
        phase: p.runPhase, air: dying || (!p.onGround && !(state === 'clear' && clearPhase === 'slide')), skid: p.skid,
        moving: Math.abs(p.vx) > 15, squash: p.squash
      });
    }
  }
  drawParts();
}
function drawLighting() {
  if (TH.night) {
    ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = 'rgb(150,160,215)'; ctx.fillRect(0, 0, VW, VH);
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < glows.length; i += 3) {
      const x = glows[i] - cam, y = glows[i + 1], r = glows[i + 2];
      const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, 'rgba(255,200,90,.28)'); g.addColorStop(1, 'rgba(255,200,90,0)');
      ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
    }
    ctx.globalCompositeOperation = 'source-over';
  }
  const [r, g, b] = TH.sun;
  let gr = ctx.createLinearGradient(0, 0, 0, VH * .6); gr.addColorStop(0, `rgba(${r},${g},${b},${TH.night ? .05 : .12})`); gr.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = gr; ctx.fillRect(0, 0, VW, VH);
  gr = ctx.createRadialGradient(VW / 2, VH * .45, VH * .35, VW / 2, VH * .5, Math.max(VW, VH) * .85);
  gr.addColorStop(0, 'rgba(0,0,20,0)'); gr.addColorStop(1, `rgba(0,0,20,${TH.night ? .55 : .38})`);
  ctx.fillStyle = gr; ctx.fillRect(0, 0, VW, VH);
}
function hudText(t, x, y, size, align, col) {
  ctx.font = `${size}px "Lilita One","Arial Black",sans-serif`; ctx.textAlign = align; ctx.textBaseline = 'top';
  ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillText(t, x + 1.5, y + 2); ctx.fillStyle = col || '#fff'; ctx.fillText(t, x, y);
}
function drawHUD() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const gh = VH * S, top = GY + 10 + (portrait ? 0 : SA.t * .5), left = Math.max(16, SA.l + 8), right = W - Math.max(16, SA.r + 8) - 54;
  const span = right - left, fs = clamp(Math.min(gh * .045, span / 20), 13, 24), ls = fs * .55;
  const cols = [
    ['SCORE', String(score).padStart(6, '0')],
    ['COINS', '×' + String(coins).padStart(2, '0')],
    ['WORLD', String(levelN)],
    ['TIME', String(Math.max(0, clock)).padStart(3, '0')],
    ['LIVES', '×' + lives]
  ];
  cols.forEach(([lab, val], i) => {
    const x = left + span * (i / (cols.length - 1)) * (i === cols.length - 1 ? 1 : 1), align = i === 0 ? 'left' : i === cols.length - 1 ? 'right' : 'center';
    ctx.font = `900 ${ls}px Nunito, sans-serif`; ctx.textAlign = align; ctx.textBaseline = 'top'; ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillText(lab, x + 1, top + 1);
    ctx.fillStyle = 'rgba(255,255,255,.82)'; ctx.fillText(lab, x, top);
    hudText(val, x, top + ls + 3, fs, align, i === 3 && clock < 100 && state === 'play' ? '#ff6b6b' : i === 1 ? '#ffd34d' : '#fff');
  });
}
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#0b0f1d'; ctx.fillRect(0, 0, cvs.width, cvs.height);
  if (!L || !scen) return;
  ctx.save();
  ctx.setTransform(DPR * S, 0, 0, DPR * S, 0, DPR * GY);
  ctx.beginPath(); ctx.rect(0, 0, VW, VH); ctx.clip();
  drawSky(); drawBackdrop();
  ctx.save();
  const k = DPR * S; ctx.translate(-Math.round(cam * k) / k, 0);
  drawWorld();
  ctx.restore();
  drawLighting();
  ctx.restore();
  if (state !== 'title') drawHUD();
}

/* ---------- loop & boot ---------- */
let last = 0, acc = 0;
function frame(t) {
  requestAnimationFrame(frame);
  const dt = Math.min(.1, (t - last) / 1000 || 0); last = t;
  acc += dt; let n = 0;
  while (acc >= STEP && n < 14) { update(STEP); acc -= STEP; n++; }
  if (n >= 14) acc = 0;
  render();
}
$('playBtn').addEventListener('click', () => startGame(1));
$('againBtn').addEventListener('click', () => startGame(1));
$('resumeBtn').addEventListener('click', resumeGame);
$('restartBtn').addEventListener('click', () => { initAudio(); checkpoint = false; startLevel(false, false); });
$('pauseBtn').addEventListener('click', () => { if (state === 'play') pauseGame(); else if (state === 'paused') resumeGame(); });
$('soundBtn').addEventListener('click', () => { initAudio(); setMuted(!muted); });
$('sound2Btn').addEventListener('click', () => { initAudio(); setMuted(!muted); });

function start(data) {
  resize(); setMuted(muted); setTouchUI(touchUI);
  $('hiText').textContent = 'Best ' + String(hi).padStart(6, '0');
  const fontWait = (document.fonts && document.fonts.load) ? Promise.race([Promise.all([document.fonts.load('64px "Lilita One"'), document.fonts.load('900 16px Nunito')]), new Promise(r => setTimeout(r, 1500))]) : Promise.resolve();
  fontWait.catch(() => {}).then(() => {
    buildTextures(); buildCastle();
    L = genLevel(1); TH = L.theme; buildScenery(TH); cam = 0;
    if (data && data.levelN > 1 && data.lives > 0) { score = data.score || 0; coins = data.coins || 0; lives = data.lives; levelN = data.levelN; }
    requestAnimationFrame(frame);
  });
}
if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
  try { window.claude.hot.snapshot(() => ({ levelN, score, coins, lives })); } catch (e) {}
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
